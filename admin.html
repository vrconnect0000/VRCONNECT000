<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jardson Imports | Command Center Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .card-shadow { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
        .hidden-admin { display: none !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* Estilos para tabela responsiva em celulares */
        @media (max-width: 768px) {
            .responsive-table thead { display: none; }
            .responsive-table tr { display: block; margin-bottom: 1rem; border: 1px solid #e2e8f0; border-radius: 1rem; background: white; padding: 1rem; }
            .responsive-table td { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border: none; text-align: right; }
            .responsive-table td::before { content: attr(data-label); font-weight: 800; text-transform: uppercase; font-size: 10px; color: #64748b; text-align: left; }
        }
    </style>
</head>
<body>

    <div id="login-screen" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-4 md:p-6">
        <div class="bg-white p-6 md:p-10 rounded-[2rem] md:rounded-[2.5rem] card-shadow w-full max-w-md border border-slate-100 text-center">
            <div class="w-14 h-14 md:w-16 md:h-16 bg-orange-500 rounded-2xl rotate-12 flex items-center justify-center mx-auto mb-6 md:mb-8 shadow-lg shadow-orange-200">
                <i class="fa-solid fa-shield-halved text-white text-xl md:text-2xl -rotate-12"></i>
            </div>
            <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-2 italic">JARDSON <span class="text-orange-500">IMPORTS</span></h2>
            <p class="text-slate-400 text-sm md:text-base font-medium mb-6 md:mb-8">Este painel é exclusivo para usuários autorizados.</p>
            <input type="password" id="admin-password" placeholder="Digite sua senha" class="w-full p-4 md:p-5 bg-slate-50 border-2 border-slate-100 rounded-2xl mb-4 text-center text-xl md:text-2xl focus:border-orange-500 outline-none transition-all">
            <button onclick="checkLogin()" class="w-full py-4 md:py-5 bg-slate-900 hover:bg-orange-600 text-white rounded-2xl font-black uppercase tracking-widest transition-all text-sm md:text-base">
                Autenticar Sistema
            </button>
        </div>
    </div>

    <div id="admin-content" class="hidden-admin">
        <nav class="glass sticky top-0 z-50 px-4 md:px-6 py-4">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2 md:gap-3">
                    <div class="bg-orange-600 p-1.5 md:p-2 rounded-lg text-white font-black italic text-xs md:text-base">JI</div>
                    <span class="font-black text-slate-900 uppercase tracking-tighter text-xs md:text-base">JARDSON IMPORTS <span class="text-orange-600 hidden md:inline">PAINEL</span></span>
                </div>
                <button onclick="logout()" class="p-2 md:p-3 bg-slate-100 text-slate-400 rounded-xl hover:bg-red-500 hover:text-white transition-all">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 md:px-6 py-6 md:py-8">
            <!-- Stats Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-6 mb-8">
                <div class="bg-white p-5 md:p-6 rounded-[1.5rem] md:rounded-[2rem] card-shadow border border-slate-50">
                    <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mb-1">Itens Ativos</p>
                    <h3 id="stat-total" class="text-2xl md:text-3xl font-black text-slate-900">0</h3>
                </div>
                <div class="bg-white p-5 md:p-6 rounded-[1.5rem] md:rounded-[2rem] card-shadow border border-slate-50">
                    <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mb-1">Patrimônio em Estoque</p>
                    <h3 id="stat-value" class="text-2xl md:text-3xl font-black text-orange-600">R$ 0,00</h3>
                </div>
                <div class="bg-white p-5 md:p-6 rounded-[1.5rem] md:rounded-[2rem] card-shadow border border-slate-50 sm:col-span-2 md:col-span-1">
                    <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mb-1">Status do Servidor</p>
                    <h3 class="text-lg md:text-xl font-black text-green-500 flex items-center gap-2 mt-2">
                        <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span> ONLINE
                    </h3>
                </div>
            </div>

            <div class="grid lg:grid-cols-12 gap-6 md:gap-10">
                <!-- Form Column -->
                <div class="lg:col-span-4 order-2 lg:order-1">
                    <div class="bg-white rounded-[2rem] md:rounded-[2.5rem] p-6 md:p-8 card-shadow lg:sticky lg:top-32">
                        <h2 class="text-lg md:text-xl font-black mb-6 md:mb-8 flex items-center gap-2">
                            <i class="fa-solid fa-circle-plus text-orange-500"></i> Novo Produto
                        </h2>
                        <form id="product-form" class="space-y-4">
                            <input type="text" id="name" placeholder="Nome do Produto" required class="w-full p-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-orange-500 outline-none font-bold text-sm">
                            
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <input type="number" id="price" step="0.01" placeholder="R$ 0,00" required class="w-full p-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-orange-500 font-bold text-sm">
                                <select id="category" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold uppercase text-[10px]">
                                    <option value="iphone">iPhone</option>
                                    <option value="samsung">Samsung</option>
                                    <option value="xiaomi">Xiaomi</option>
                                    <option value="motorola">Motorola</option>
                                    <option value="realme">Realme</option>
                                    <option value="tablet">Tablet</option>
                                    <option value="som">Som/Caixas</option>
                                    <option value="games">Games</option>
                                    <option value="academia">Academia</option>
                                    <option value="perfumes">Perfumes</option>
                                    <option value="tvbox">TV & Box</option>
                                    <option value="eletrodomesticos">Eletrodomésticos</option>
                                    <option value="acessorios">Acessórios</option>
                                </select>
                            </div>
                            
                            <textarea id="description" placeholder="Descrição curta..." class="w-full p-4 bg-slate-50 border-none rounded-2xl h-24 outline-none focus:ring-2 focus:ring-orange-500 text-sm"></textarea>
                            
                            <div class="relative">
                                <label class="w-full p-6 md:p-8 border-2 border-dashed border-slate-200 rounded-3xl flex flex-col items-center justify-center cursor-pointer hover:border-orange-500 transition-all bg-slate-50/50">
                                    <i class="fa-solid fa-images text-2xl md:text-3xl text-slate-300 mb-2"></i>
                                    <span id="file-label" class="text-[10px] font-black text-slate-400 uppercase text-center">Subir até 4 Fotos</span>
                                    <input type="file" id="photos" class="hidden" accept="image/*" multiple>
                                </label>
                                <div id="previa-fotos" class="flex flex-wrap gap-2 mt-3"></div>
                            </div>

                            <button type="submit" id="btn-save" class="w-full py-4 md:py-5 bg-orange-600 text-white rounded-[1.5rem] font-black uppercase tracking-widest shadow-xl shadow-orange-100 hover:bg-slate-900 transition-all text-sm">
                                Publicar Agora
                            </button>
                        </form>
                    </div>
                </div>

                <!-- List Column -->
                <div class="lg:col-span-8 space-y-6 order-1 lg:order-2">
                    <div class="flex items-center gap-4 bg-white p-4 md:p-5 rounded-2xl md:rounded-3xl card-shadow">
                        <i class="fa-solid fa-magnifying-glass text-slate-300"></i>
                        <input type="text" id="search" onkeyup="filterTable()" placeholder="Pesquisar..." class="w-full bg-transparent border-none outline-none font-bold text-slate-600 text-sm">
                    </div>

                    <div class="bg-white rounded-[2rem] md:rounded-[2.5rem] card-shadow overflow-hidden border border-slate-50">
                        <div class="p-6 md:p-8 border-b flex justify-between items-center">
                            <h2 class="font-black text-slate-900 uppercase tracking-widest text-xs md:text-sm">Estoque Atual</h2>
                            <button onclick="fetchProducts()" class="text-slate-400 hover:text-orange-600 p-2"><i class="fa-solid fa-rotate"></i></button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full responsive-table">
                                <thead class="bg-slate-50 text-[9px] font-black text-slate-400 uppercase tracking-[0.2em]">
                                    <tr>
                                        <th class="px-4 md:px-8 py-4 md:py-5 text-left">Produto</th>
                                        <th class="px-4 md:px-8 py-4 md:py-5 text-left">Preço</th>
                                        <th class="px-4 md:px-8 py-4 md:py-5 text-center">Fotos</th>
                                        <th class="px-4 md:px-8 py-4 md:py-5 text-center">Promo</th>
                                        <th class="px-4 md:px-8 py-4 md:py-5 text-center">Ação</th>
                                    </tr>
                                </thead>
                                <tbody id="product-list" class="divide-y divide-slate-50">
                                    <!-- Lista carregada via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- CONFIGURAÇÃO ---
        const MASTER_PASS = "Jardson"; // ALTERE SUA SENHA AQUI
        const SUPABASE_URL = 'https://qqspmuaukoaetilbaflv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_DN831m2SDg4cVvfn8Vc0pA_VZGfs_9u';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const photosInput = document.getElementById('photos');
        const previaContainer = document.getElementById('previa-fotos');

        // LOGIN
        function checkLogin() {
            if(document.getElementById('admin-password').value === MASTER_PASS) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-content').classList.remove('hidden-admin');
                fetchProducts();
            } else { alert("Senha Incorreta!"); }
        }
        function logout() { location.reload(); }

        // PRÉ-VISUALIZAÇÃO DE FOTOS
        photosInput.onchange = function() {
            previaContainer.innerHTML = "";
            const files = Array.from(this.files).slice(0, 4);
            document.getElementById('file-label').innerText = `${files.length} selecionadas (Máx 4)`;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = "w-10 h-10 md:w-14 md:h-14 object-cover rounded-xl border-2 border-white shadow-sm";
                    previaContainer.appendChild(img);
                }
                reader.readAsDataURL(file);
            });
        };

        // CARREGAR E ATUALIZAR STATS
        async function fetchProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = `<tr><td colspan="5" class="p-20 text-center"><i class="fa-solid fa-spinner animate-spin text-3xl text-orange-500"></i></td></tr>`;
            
            const { data, error } = await _supabase.from('produtos').select('*').order('created_at', { ascending: false });
            if(error) return;

            // Stats
            document.getElementById('stat-total').innerText = data.length;
            const total = data.reduce((acc, p) => acc + p.price, 0);
            document.getElementById('stat-value').innerText = `R$ ${total.toLocaleString('pt-br', {minimumFractionDigits: 2})}`;

            list.innerHTML = data.map(p => `
                <tr class="hover:bg-slate-50/50 transition-all group">
                    <td class="px-4 md:px-8 py-4 md:py-5" data-label="Produto">
                        <div class="flex items-center gap-3 md:gap-4">
                            <div class="flex-1">
                                <p class="font-black text-slate-900 text-xs md:text-sm uppercase leading-tight">${p.name}</p>
                                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">${p.category}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-4 md:px-8 py-4 md:py-5" data-label="Preço">
                        <button onclick="editPrice(${p.id}, ${p.price})" class="font-black text-slate-700 hover:text-orange-600 text-xs md:text-sm">
                            R$ ${p.price.toLocaleString('pt-br', {minimumFractionDigits: 2})}
                        </button>
                    </td>
                    <td class="px-4 md:px-8 py-4 md:py-5 text-center" data-label="Fotos">
                        <span class="bg-slate-100 px-3 py-1 rounded-full text-[10px] font-black text-slate-500">${p.images ? p.images.length : 0}</span>
                    </td>
                    <td class="px-4 md:px-8 py-4 md:py-5 text-center" data-label="Promo">
                        <button onclick="togglePromo(${p.id}, ${p.promo})" class="w-10 h-6 rounded-full relative transition-all ${p.promo ? 'bg-orange-500' : 'bg-slate-200'}">
                            <div class="w-4 h-4 bg-white rounded-full absolute top-1 transition-all ${p.promo ? 'right-1' : 'left-1'} shadow-sm"></div>
                        </button>
                    </td>
                    <td class="px-4 md:px-8 py-4 md:py-5 text-center" data-label="Ação">
                        <button onclick="deleteProduct(${p.id})" class="p-2 md:p-3 text-slate-300 hover:text-red-500 transition-all"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        // CRUD ACTIONS
        async function editPrice(id, current) {
            const novo = prompt("Novo Preço:", current);
            if(novo && !isNaN(novo)) {
                await _supabase.from('produtos').update({ price: parseFloat(novo) }).eq('id', id);
                fetchProducts();
            }
        }

        async function togglePromo(id, current) {
            await _supabase.from('produtos').update({ promo: !current }).eq('id', id);
            fetchProducts();
        }

        async function deleteProduct(id) {
            if(confirm("Deseja excluir permanentemente?")) {
                await _supabase.from('produtos').delete().eq('id', id);
                fetchProducts();
            }
        }

        // UPLOAD E SALVAR
        document.getElementById('product-form').onsubmit = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> PUBLICANDO...`;

            const name = document.getElementById('name').value;
            const price = parseFloat(document.getElementById('price').value);
            const category = document.getElementById('category').value;
            const description = document.getElementById('description').value;
            const files = Array.from(photosInput.files).slice(0, 4);

            let images = [];
            for(const file of files) {
                const base64 = await toBase64(file);
                images.push(base64);
            }

            const { error } = await _supabase.from('produtos').insert([{ name, price, category, description, images, promo: false }]);
            
            if(error) {
                alert("Erro ao salvar!");
                console.error(error);
            } else {
                this.reset();
                previaContainer.innerHTML = "";
                document.getElementById('file-label').innerText = "Subir até 4 Fotos";
                fetchProducts();
            }

            btn.disabled = false;
            btn.innerText = "Publicar Agora";
        };

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        function filterTable() {
            const query = document.getElementById('search').value.toLowerCase();
            const rows = document.querySelectorAll('#product-list tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(query) ? '' : 'none';
            });
        }
    </script>
</body>
</html>
