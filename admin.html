<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardson Imports | Command Center Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .card-shadow { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
        .hidden-admin { display: none !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="login-screen" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-6">
        <div class="bg-white p-10 rounded-[2.5rem] card-shadow w-full max-w-md border border-slate-100 text-center">
            <div class="w-16 h-16 bg-orange-500 rounded-2xl rotate-12 flex items-center justify-center mx-auto mb-8 shadow-lg shadow-orange-200">
                <i class="fa-solid fa-shield-halved text-white text-2xl -rotate-12"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-slate-900 mb-2 italic">JARDSON <span class="text-orange-500">IMPORTS</span></h2>
            <p class="text-slate-400 font-medium mb-8">Este painel é exclusivo para usuários autorizados.</p>
            <input type="password" id="admin-password" placeholder="Digite sua senha" class="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-2xl mb-4 text-center text-2xl focus:border-orange-500 outline-none transition-all">
            <button onclick="checkLogin()" class="w-full py-5 bg-slate-900 hover:bg-orange-600 text-white rounded-2xl font-black uppercase tracking-widest transition-all">
                Autenticar Sistema
            </button>
        </div>
    </div>

    <div id="admin-content" class="hidden-admin">
        <nav class="glass sticky top-0 z-50 px-6 py-4">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-orange-600 p-2 rounded-lg text-white font-black italic">JI</div>
                    <span class="font-black text-slate-900 uppercase tracking-tighter">JARDSON IMPORTS <span class="text-orange-600">PAINEL</span></span>
                </div>
                <button onclick="logout()" class="p-3 bg-slate-100 text-slate-400 rounded-xl hover:bg-red-500 hover:text-white transition-all">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-6 py-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-[2rem] card-shadow border border-slate-50">
                    <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mb-1">Itens Ativos</p>
                    <h3 id="stat-total" class="text-3xl font-black text-slate-900">0</h3>
                </div>
                <div class="bg-white p-6 rounded-[2rem] card-shadow border border-slate-50">
                    <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mb-1">Patrimônio em Estoque</p>
                    <h3 id="stat-value" class="text-3xl font-black text-orange-600">R$ 0,00</h3>
                </div>
                <div class="bg-white p-6 rounded-[2rem] card-shadow border border-slate-50">
                    <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mb-1">Status do Servidor</p>
                    <h3 class="text-xl font-black text-green-500 flex items-center gap-2 mt-2">
                        <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span> ONLINE
                    </h3>
                </div>
            </div>

            <div class="grid lg:grid-cols-12 gap-10">
                <div class="lg:col-span-4">
                    <div class="bg-white rounded-[2.5rem] p-8 card-shadow sticky top-32">
                        <h2 class="text-xl font-black mb-8 flex items-center gap-2">
                            <i class="fa-solid fa-circle-plus text-orange-500"></i> Novo Produto
                        </h2>
                        <form id="product-form" class="space-y-4">
                            <input type="text" id="name" placeholder="Nome do Produto" required class="w-full p-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-orange-500 outline-none font-bold">
                            
                            <div class="grid grid-cols-2 gap-3">
                                <input type="number" id="price" step="0.01" placeholder="R$ 0,00" required class="w-full p-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-orange-500 font-bold">
                                <select id="category" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold uppercase text-[10px]">
                                <option value="iphone">iPhone</option>
                                <option value="samsung">Samsung</option>
                                <option value="xiaomi">Xiaomi</option>
                                <option value="motorola">Motorola</option>
                                <option value="realme">Realme</option>
                                <option value="tablet">Tablet</option>
                                <option value="som">Som/Caixas</option>
                                <option value="games">Games</option>
                                <option value="academia">Academia</option>
                                <option value="perfumes">Perfumes</option>
                                <option value="tvbox">TV & Box</option>
                                <option value="eletrodomesticos">Eletrodomésticos</option>
                                <option value="acessorios">Acessórios</option>
                                </select>
                            </div>
                            
                            <textarea id="description" placeholder="Descrição curta..." class="w-full p-4 bg-slate-50 border-none rounded-2xl h-24 outline-none focus:ring-2 focus:ring-orange-500"></textarea>
                            
                            <div class="relative">
                                <label class="w-full p-8 border-2 border-dashed border-slate-200 rounded-3xl flex flex-col items-center justify-center cursor-pointer hover:border-orange-500 transition-all bg-slate-50/50">
                                    <i class="fa-solid fa-images text-3xl text-slate-300 mb-2"></i>
                                    <span id="file-label" class="text-[10px] font-black text-slate-400 uppercase">Subir até 4 Fotos</span>
                                    <input type="file" id="photos" class="hidden" accept="image/*" multiple>
                                </label>
                                <div id="previa-fotos" class="flex flex-wrap gap-2 mt-3"></div>
                            </div>

                            <button type="submit" id="btn-save" class="w-full py-5 bg-orange-600 text-white rounded-[1.5rem] font-black uppercase tracking-widest shadow-xl shadow-orange-100 hover:bg-slate-900 transition-all">
                                Publicar Agora
                            </button>
                        </form>
                    </div>
                </div>

                <div class="lg:col-span-8 space-y-6">
                    <div class="flex items-center gap-4 bg-white p-5 rounded-3xl card-shadow">
                        <i class="fa-solid fa-magnifying-glass text-slate-300"></i>
                        <input type="text" id="search" onkeyup="filterTable()" placeholder="Pesquisar por nome, categoria ou preço..." class="w-full bg-transparent border-none outline-none font-bold text-slate-600">
                    </div>

                    <div class="bg-white rounded-[2.5rem] card-shadow overflow-hidden border border-slate-50">
                        <div class="p-8 border-b flex justify-between items-center">
                            <h2 class="font-black text-slate-900 uppercase tracking-widest text-sm">Estoque Atual</h2>
                            <button onclick="fetchProducts()" class="text-slate-400 hover:text-orange-600"><i class="fa-solid fa-rotate"></i></button>
                        </div>
                        <table class="w-full">
                            <thead class="bg-slate-50 text-[9px] font-black text-slate-400 uppercase tracking-[0.2em]">
                                <tr>
                                    <th class="px-8 py-5 text-left">Produto</th>
                                    <th class="px-8 py-5 text-left">Preço (Clique)</th>
                                    <th class="px-8 py-5 text-center">Fotos</th>
                                    <th class="px-8 py-5 text-center">Promo</th>
                                    <th class="px-8 py-5 text-center">Ação</th>
                                </tr>
                            </thead>
                            <tbody id="product-list" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- CONFIGURAÇÃO ---
        const MASTER_PASS = "123"; // ALTERE SUA SENHA AQUI
        const SUPABASE_URL = 'https://qqspmuaukoaetilbaflv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_DN831m2SDg4cVvfn8Vc0pA_VZGfs_9u';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const photosInput = document.getElementById('photos');
        const previaContainer = document.getElementById('previa-fotos');

        // LOGIN
        function checkLogin() {
            if(document.getElementById('admin-password').value === MASTER_PASS) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-content').classList.remove('hidden-admin');
                fetchProducts();
            } else { alert("Senha Incorreta!"); }
        }
        function logout() { location.reload(); }

        // PRÉ-VISUALIZAÇÃO DE FOTOS
        photosInput.onchange = function() {
            previaContainer.innerHTML = "";
            const files = Array.from(this.files).slice(0, 4);
            document.getElementById('file-label').innerText = `${files.length} selecionadas (Máx 4)`;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = "w-14 h-14 object-cover rounded-xl border-2 border-white shadow-sm";
                    previaContainer.appendChild(img);
                }
                reader.readAsDataURL(file);
            });
        };

        // CARREGAR E ATUALIZAR STATS
        async function fetchProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = `<tr><td colspan="5" class="p-20 text-center"><i class="fa-solid fa-spinner animate-spin text-3xl text-orange-500"></i></td></tr>`;
            
            const { data, error } = await _supabase.from('produtos').select('*').order('created_at', { ascending: false });
            if(error) return;

            // Stats
            document.getElementById('stat-total').innerText = data.length;
            const total = data.reduce((acc, p) => acc + p.price, 0);
            document.getElementById('stat-value').innerText = `R$ ${total.toLocaleString('pt-br', {minimumFractionDigits: 2})}`;

            list.innerHTML = data.map(p => `
                <tr class="hover:bg-slate-50/50 transition-all group">
                    <td class="px-8 py-5">
                        <div class="flex items-center gap-4">
                            <img src="${p.images[0]}" class="w-14 h-14 object-cover rounded-2xl shadow-sm bg-slate-100">
                            <div>
                                <p class="font-bold text-slate-800 leading-none mb-1 text-sm">${p.name}</p>
                                <span class="text-[9px] font-black text-slate-400 uppercase bg-slate-100 px-2 py-0.5 rounded">${p.category}</span>
                            </div>
                        </div>
                    </td>
                    <td class="px-8 py-5">
                        <button onclick="editPrice(${p.id}, ${p.price})" class="font-black text-slate-900 hover:text-orange-600">
                            R$ ${p.price.toLocaleString('pt-br', {minimumFractionDigits: 2})}
                        </button>
                    </td>
                    <td class="px-8 py-5 text-center text-[10px] font-bold text-slate-400">
                        <i class="fa-solid fa-images"></i> ${p.images ? p.images.length : 0}
                    </td>
                    <td class="px-8 py-5 text-center">
                        <button onclick="togglePromo(${p.id}, ${p.promo})" class="text-lg">
                            ${p.promo ? '<i class="fa-solid fa-fire text-orange-500"></i>' : '<i class="fa-solid fa-fire text-slate-200"></i>'}
                        </button>
                    </td>
                    <td class="px-8 py-5 text-center">
                        <button onclick="deleteProd(${p.id})" class="p-3 text-red-400 hover:bg-red-500 hover:text-white rounded-xl transition-all">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // SALVAR COM LOOP DE IMAGENS
        document.getElementById('product-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-save');
            const files = Array.from(photosInput.files).slice(0, 4);
            btn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i> ENVIANDO...`;
            btn.disabled = true;

            try {
                let imageUrls = [];
                if(files.length > 0) {
                    for (const file of files) {
                        const fileName = `${Date.now()}_${file.name}`;
                        await _supabase.storage.from('fotos-produtos').upload(fileName, file);
                        const { data: pub } = _supabase.storage.from('fotos-produtos').getPublicUrl(fileName);
                        imageUrls.push(pub.publicUrl);
                    }
                } else { imageUrls = ['https://via.placeholder.com/400']; }

                await _supabase.from('produtos').insert([{
                    name: document.getElementById('name').value,
                    price: parseFloat(document.getElementById('price').value),
                    category: document.getElementById('category').value,
                    description: document.getElementById('description').value,
                    images: imageUrls,
                    promo: false
                }]);
                
                document.getElementById('product-form').reset();
                previaContainer.innerHTML = "";
                fetchProducts();
                alert("✅ Produto publicado com sucesso!");
            } catch (err) { alert("❌ Erro no sistema"); }
            finally { btn.innerHTML = "Publicar Agora"; btn.disabled = false; }
        };

        async function editPrice(id, current) {
            const n = prompt("Novo Preço:", current);
            if(!n) return;
            await _supabase.from('produtos').update({ price: parseFloat(n) }).eq('id', id);
            fetchProducts();
        }

        async function togglePromo(id, status) {
            await _supabase.from('produtos').update({ promo: !status }).eq('id', id);
            fetchProducts();
        }

        async function deleteProd(id) {
            if(confirm("Deseja mesmo remover do estoque?")) {
                await _supabase.from('produtos').delete().eq('id', id);
                fetchProducts();
            }
        }

        function filterTable() {
            const input = document.getElementById("search").value.toUpperCase();
            const rows = document.getElementById("product-list").getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                const text = rows[i].textContent || rows[i].innerText;
                rows[i].style.display = text.toUpperCase().indexOf(input) > -1 ? "" : "none";
            }
        }
    </script>
</body>
</html>
