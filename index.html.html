<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardson Imports | Premium Store</title>
    
    <link rel="icon" type="image/png" href="https://files.catbox.moe/hieucw.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        :root { --accent: #0ea5e9; --bg-dark: #020617; --card-bg: #0f172a; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: white; scroll-behavior: smooth; overflow-x: hidden; }
        
        .promo-banner { background: linear-gradient(90deg, #0ea5e9, #2563eb); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; text-align: center; color: white; }
        .nav-blur { background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        /* Logo Fix para Mobile/PC */
        .logo-box { display: flex; align-items: center; justify-content: center; background: transparent; flex-shrink: 0; }
        .logo-img-clean { width: 100%; height: 100%; object-fit: contain; filter: brightness(1.2); }

        .product-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; transition: all 0.4s; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .product-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        
        .discount-badge { position: absolute; top: 10px; left: 10px; background: #ef4444; color: white; font-size: 8px; font-weight: 900; padding: 3px 8px; border-radius: 99px; z-index: 10; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-gradient { background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%); transition: 0.3s; color: white; font-weight: 800; cursor: pointer; border:none; }
        
        .category-btn { padding: 8px 16px; border-radius: 99px; font-size: 10px; font-weight: 700; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.1); white-space: nowrap; transition: 0.3s; background: rgba(255,255,255,0.05); color: white; }
        .category-btn.active { background: #0ea5e9; color: white; border-color: #0ea5e9; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }
        .category-scroll::-webkit-scrollbar { display: none; }

        #checkout-modal, #cart-modal { display: none; background: rgba(0,0,0,0.9); z-index: 1000; }
        
        /* Imagem do Produto Adaptável */
        .img-container { background: white; border-radius: 12px; margin-bottom: 0.5rem; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 140px; width: 100%; }
        @media (min-width: 768px) { .img-container { height: 200px; } }
        
        .cart-float { position: fixed; bottom: 20px; right: 20px; width: 55px; height: 55px; background: #0ea5e9; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 10px 25px rgba(14, 165, 233, 0.5); cursor: pointer; z-index: 900; transition: 0.3s; color: white; }
    </style>
</head>
<body class="antialiased">

    <div class="promo-banner fixed w-full z-[100] top-0 text-[9px] md:text-xs py-2 px-2">
        🔥 USE O CUPOM <span class="bg-white text-blue-600 px-2 rounded mx-1 font-bold">JARDSON25</span> PARA R$ 25 OFF!
    </div>

    <nav class="fixed w-full z-[80] nav-blur top-8 py-2 px-4 md:px-12 flex justify-between items-center">
        <div class="flex items-center gap-2 md:gap-4">
            <div class="logo-box w-[50px] h-[50px] md:w-[70px] md:h-[70px]">
                <img src="https://files.catbox.moe/hieucw.png" class="logo-img-clean" alt="Logo">
            </div>
            <div class="flex flex-col">
                <span class="text-lg md:text-2xl font-black tracking-tighter leading-none">
                    JARDSON <span class="text-sky-500">IMPORTS</span>
                </span>
                <span class="text-[8px] md:text-[10px] text-sky-300 font-bold uppercase tracking-widest">Premium Store</span>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <span class="hidden md:block text-[10px] font-bold text-green-500 uppercase border border-green-500/30 px-2 py-1 rounded-lg">
                <i class="fas fa-truck mr-1"></i> Frete Grátis
            </span>
            <a href="https://api.whatsapp.com/send?phone=5596991189596" class="bg-green-600 text-white w-10 h-10 md:w-11 md:h-11 flex items-center justify-center rounded-full shadow-lg">
                <i class="fab fa-whatsapp text-xl"></i>
            </a>
        </div>
    </nav>

    <div class="cart-float" onclick="openCart()">
        <i class="fas fa-shopping-cart"></i>
        <div id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-[#020617]">0</div>
    </div>

    <header class="pt-48 md:pt-64 pb-10 px-6 text-center">
        <h1 class="text-3xl md:text-6xl font-black mb-8 tracking-tight" data-aos="fade-up">
            COMPRE HOJE!<br><span class="text-sky-500 italic">RECEBA HOJE EM CASA..</span>
        </h1>
        
        <div class="max-w-md mx-auto glass p-1 rounded-2xl flex items-center px-4 mb-8" data-aos="fade-up">
            <i class="fas fa-search text-slate-500 mr-3"></i>
            <input type="text" id="searchInput" onkeyup="searchProduct()" placeholder="Buscar produto..." class="bg-transparent w-full outline-none text-sm py-3 text-white">
        </div>

        <div class="flex overflow-x-auto gap-2 max-w-5xl mx-auto pb-4 category-scroll px-4 md:justify-center" data-aos="fade-up">
            <button onclick="filterByCategory('todos', this)" class="category-btn active">Todos</button>
            <button onclick="filterByCategory('iphone', this)" class="category-btn">iPhone</button>
            <button onclick="filterByCategory('samsung', this)" class="category-btn">Samsung</button>
            <button onclick="filterByCategory('xiaomi', this)" class="category-btn">Xiaomi</button>
            <button onclick="filterByCategory('som', this)" class="category-btn">Som</button>
            <button onclick="filterByCategory('tablet', this)" class="category-btn">Tablets</button>
            <button onclick="filterByCategory('games', this)" class="category-btn">Games</button>
        </div>
    </header>

    <main class="container mx-auto px-4 md:px-12 pb-24">
        <div id="catalog-content" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-6"></div>
    </main>

    <div id="cart-modal" class="fixed inset-0 flex items-center justify-center p-4">
        <div class="glass p-6 rounded-[30px] w-full max-w-lg relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeCart()" class="absolute top-4 right-4 text-slate-500"><i class="fas fa-times"></i></button>
            <h2 class="text-xl font-black mb-6 uppercase">🛒 Seu Carrinho</h2>
            <div id="cart-items" class="space-y-4 mb-6"></div>
            <div id="cart-empty-msg" class="text-center py-8 hidden">
                <p class="text-slate-500">Seu carrinho está vazio.</p>
            </div>
            <div class="border-t border-white/10 pt-4">
                <div class="flex justify-between items-center mb-6">
                    <span class="font-bold">Subtotal:</span>
                    <span id="cart-total-price" class="text-xl font-black text-sky-500">R$ 0,00</span>
                </div>
                <button onclick="goToCheckout()" id="btn-go-checkout" class="btn-gradient w-full py-4 rounded-xl uppercase font-black">Finalizar Pedido</button>
            </div>
        </div>
    </div>

    <div id="checkout-modal" class="fixed inset-0 flex items-center justify-center p-4">
        <div class="glass p-6 rounded-[30px] w-full max-w-lg relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-500"><i class="fas fa-times"></i></button>
            
            <div id="step-1">
                <h2 class="text-xl font-black mb-4 uppercase">📋 Dados de Entrega</h2>
                <div id="prod-resumo" class="bg-white/5 p-4 rounded-2xl mb-4 border border-white/10 text-[10px] space-y-1 italic text-sky-400"></div>
                <form onsubmit="nextStep(event)" class="space-y-3">
                    <input type="text" id="cust_name" placeholder="Nome Completo" required class="w-full p-3 rounded-xl bg-slate-800 border border-white/10 outline-none">
                    <input type="text" id="cust_street" placeholder="Endereço Completo" required class="w-full p-3 rounded-xl bg-slate-800 border border-white/10 outline-none">
                    <input type="text" id="coupon_input" placeholder="Cupom" class="w-full p-3 rounded-xl bg-slate-900 border border-white/20 outline-none uppercase font-bold text-sky-500">
                    <div class="bg-sky-500/10 p-4 rounded-2xl flex justify-between items-center">
                        <span class="text-xs font-bold uppercase">Total Final:</span>
                        <span id="final-price" class="text-xl font-black text-sky-500"></span>
                    </div>
                    <button type="submit" class="btn-gradient w-full py-4 rounded-xl uppercase font-black">Gerar Pagamento</button>
                </form>
            </div>

            <div id="step-2" class="hidden text-center">
                <h2 class="text-xl font-black mb-4">PAGAMENTO PIX</h2>
                <div class="bg-white p-4 rounded-2xl inline-block mb-4">
                    <img src="https://quickchart.io/qr?text=CHAVE-PIX-AQUI" class="w-40 mx-auto">
                </div>
                <p class="text-[10px] text-sky-500 mb-4 font-bold">Pague e envie o comprovante abaixo</p>
                <button onclick="sendOrder()" class="btn-gradient w-full py-4 rounded-xl !bg-green-600">Enviar no WhatsApp</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
        let cart = [];
        let discount = 0;

        const products = [
            { id: 1, name: "iPhone 17 Pro Max 256GB", price: 10099, promo: true, category: "iphone", image: "https://m.media-amazon.com/images/I/51nj2ICJyeL._AC_SX342_.jpg" },
            { id: 2, name: "Samsung S24 Ultra 256GB", price: 6900, promo: true, category: "samsung", image: "https://m.media-amazon.com/images/I/71ZJ6wYwYGL._AC_SX425_.jpg" },
            { id: 3, name: "Redmi Note 13 Pro 5G", price: 2500, promo: true, category: "xiaomi", image: "https://m.media-amazon.com/images/I/71Z2z5nW3ZL._AC_SX425_.jpg" },
            { id: 4, name: "JBL Boombox 3", price: 2100, promo: false, category: "som", image: "https://m.media-amazon.com/images/I/51x0NvQUgbL._AC_SY450_.jpg" },
            { id: 5, name: "Redmi Pad SE 128GB", price: 1300, promo: true, category: "tablet", image: "https://m.media-amazon.com/images/I/51hiI7caFTL._AC_SX679_.jpg" }
        ];

        function render(list = products) {
            const container = document.getElementById('catalog-content');
            container.innerHTML = list.map(p => `
                <div class="product-card p-3 md:p-4 flex flex-col" data-aos="fade-up">
                    ${p.promo ? '<span class="discount-badge">OFERTA</span>' : ''}
                    <div class="img-container">
                        <img src="${p.image}" alt="${p.name}" class="max-h-full max-w-full p-2 object-contain">
                    </div>
                    <div class="flex-grow">
                        <h3 class="text-[11px] md:text-sm font-bold h-8 md:h-10 line-clamp-2">${p.name}</h3>
                        <p class="text-lg md:text-2xl font-black mt-1 text-white">R$ ${p.price.toLocaleString('pt-BR')}</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="btn-gradient w-full py-2.5 rounded-lg text-[10px] uppercase mt-3">Comprar</button>
                </div>
            `).join('');
        }

        function filterByCategory(cat, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filtered = cat === 'todos' ? products : products.filter(p => p.category === cat);
            render(filtered);
        }

        function searchProduct() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(term));
            render(filtered);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const inCart = cart.find(item => item.id === id);
            if (inCart) { inCart.qty++; } else { cart.push({ ...product, qty: 1 }); }
            updateCartUI();
            openCart();
        }

        function updateCartUI() {
            const count = cart.reduce((acc, item) => acc + item.qty, 0);
            document.getElementById('cart-count').innerText = count;
            const container = document.getElementById('cart-items');
            const totalDisplay = document.getElementById('cart-total-price');
            
            if (cart.length === 0) {
                container.innerHTML = "<p class='text-center text-slate-500'>Vazio</p>";
            } else {
                container.innerHTML = cart.map(item => `
                    <div class="flex items-center gap-3 bg-white/5 p-2 rounded-xl">
                        <img src="${item.image}" class="w-12 h-12 object-contain bg-white rounded p-1">
                        <div class="flex-grow">
                            <h4 class="text-[10px] font-bold line-clamp-1">${item.name}</h4>
                            <p class="text-sky-400 font-bold text-xs">R$ ${item.price.toLocaleString('pt-BR')}</p>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="text-red-500 px-2"><i class="fas fa-trash"></i></button>
                    </div>
                `).join('');
            }
            const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            totalDisplay.innerText = `R$ ${total.toLocaleString('pt-BR')}`;
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            updateCartUI();
        }

        function openCart() { document.getElementById('cart-modal').style.display = 'flex'; }
        function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }
        function closeModal() { document.getElementById('checkout-modal').style.display = 'none'; }
        
        function goToCheckout() {
            closeCart();
            const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            document.getElementById('final-price').innerText = `R$ ${total.toLocaleString('pt-BR')}`;
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function nextStep(e) { e.preventDefault(); document.getElementById('step-1').classList.add('hidden'); document.getElementById('step-2').classList.remove('hidden'); }

        function sendOrder() {
            const nome = document.getElementById('cust_name').value;
            const endereco = document.getElementById('cust_street').value;
            let msg = `*NOVO PEDIDO - JARDSON IMPORTS*\n\n`;
            msg += `*Cliente:* ${nome}\n`;
            msg += `*Endereço:* ${endereco}\n\n`;
            msg += `*Produtos:*\n`;
            cart.forEach(item => { msg += `• ${item.qty}x ${item.name}\n`; });
            
            const total = document.getElementById('final-price').innerText;
            msg += `\n*TOTAL:* ${total}`;
            
            window.open(`https://api.whatsapp.com/send?phone=5596991189596&text=${encodeURIComponent(msg)}`);
        }

        render();
    </script>
</body>
</html>
