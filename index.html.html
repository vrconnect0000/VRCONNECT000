        function render(list = products) {
            const container = document.getElementById('catalog-content');
            container.innerHTML = list.map(p => `
                <div class="product-card p-4 flex flex-col" data-aos="fade-up">
                    ${p.promo ? '<span class="discount-badge">OFERTA DO DIA</span>' : ''}
                    <div class="img-container">
                        <img src="${p.image}" alt="${p.name}" class="max-h-full max-w-full p-2 object-contain">
                    </div>
                    <div class="flex-grow">
                        <h3 class="text-sm font-bold h-10 line-clamp-2">${p.name}</h3>
                        <p class="text-2xl font-black mt-2 text-white">R$ ${p.price.toLocaleString('pt-BR')}</p>
                        <p class="text-[10px] text-green-500 font-bold uppercase tracking-widest mt-1 italic">ENTREGA GRÁTIS</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="btn-gradient w-full py-3 rounded-xl text-xs uppercase mt-6">Adicionar ao Carrinho</button>
                </div>
            `).join('');
        }

        function searchProduct() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(term));
            render(filtered);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const inCart = cart.find(item => item.id === id);
            if (inCart) { inCart.qty++; } else { cart.push({ ...product, qty: 1 }); }
            updateCartUI();
            openCart();
        }

        function updateCartUI() {
            const count = cart.reduce((acc, item) => acc + item.qty, 0);
            document.getElementById('cart-count').innerText = count;
            const container = document.getElementById('cart-items');
            const emptyMsg = document.getElementById('cart-empty-msg');
            const totalDisplay = document.getElementById('cart-total-price');
            
            if (cart.length === 0) {
                container.innerHTML = "";
                emptyMsg.classList.remove('hidden');
                document.getElementById('btn-go-checkout').disabled = true;
            } else {
                emptyMsg.classList.add('hidden');
                document.getElementById('btn-go-checkout').disabled = false;
                container.innerHTML = cart.map(item => `
                    <div class="flex items-center gap-4 bg-white/5 p-3 rounded-2xl border border-white/5">
                        <img src="${item.image}" class="w-16 h-16 object-contain bg-white rounded-lg p-1">
                        <div class="flex-grow">
                            <h4 class="text-[10px] font-bold line-clamp-1">${item.name}</h4>
                            <p class="text-sky-500 font-black text-sm">R$ ${(item.price * item.qty).toLocaleString('pt-BR')}</p>
                            <div class="flex items-center gap-3 mt-1">
                                <button onclick="changeQty(${item.id}, -1)" class="w-5 h-5 rounded bg-white/10 text-xs">-</button>
                                <span class="text-xs">${item.qty}</span>
                                <button onclick="changeQty(${item.id}, 1)" class="w-5 h-5 rounded bg-white/10 text-xs">+</button>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="text-red-500 p-2"><i class="fas fa-trash text-xs"></i></button>
                    </div>
                `).join('');
            }
            const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            totalDisplay.innerText = `R$ ${total.toLocaleString('pt-BR')}`;
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) removeFromCart(id);
                else updateCartUI();
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            updateCartUI();
        }

        function openCart() { document.getElementById('cart-modal').style.display = 'flex'; }
        function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }
        function closeModal() { document.getElementById('checkout-modal').style.display = 'none'; }

        function goToCheckout() {
            closeCart();
            const summary = document.getElementById('prod-resumo');
            summary.innerHTML = cart.map(item => `<div>• ${item.qty}x ${item.name}</div>`).join('');
            discount = 0;
            updateTotal();
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function applyCoupon() {
            const code = document.getElementById('coupon_input').value.toUpperCase();
            const msg = document.getElementById('coupon-msg');
            if(code === 'JARDSON25') {
                discount = 25; 
                msg.innerText = "✅ CUPOM APLICADO!";
                msg.className = "text-green-500 font-bold text-[10px]";
            } else {
                discount = 0;
                msg.innerText = "❌ INVÁLIDO";
                msg.className = "text-red-500 font-bold text-[10px]";
            }
            updateTotal();
        }

        function updateTotal() {
            const totalItems = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            const final = Math.max(0, totalItems - discount);
            document.getElementById('final-price').innerText = `R$ ${final.toLocaleString('pt-BR')}`;
        }

        function nextStep(e) { e.preventDefault(); document.getElementById('step-1').classList.add('hidden'); document.getElementById('step-2').classList.remove('hidden'); }

        function copyPix() {
            navigator.clipboard.writeText("5596991557184");
            alert("Chave PIX copiada!");
        }
